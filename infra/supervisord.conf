[supervisord]
nodaemon=false
logfile=/var/log/supervisor/supervisord.log
logfile_maxbytes=10MB
logfile_backups=3
loglevel=info
pidfile=/var/run/supervisord.pid

; ── API Gateway (Port 8000 — only public-facing port) ──────────────────────
[program:gateway]
command=python -m uvicorn app.main:app --host 0.0.0.0 --port 8000
directory=/app/gateway
autostart=true
autorestart=true
startretries=5
startsecs=5
stdout_logfile=/var/log/supervisor/gateway.log
stderr_logfile=/var/log/supervisor/gateway.err.log
priority=100   ; Start gateway last (after all backends are up)

; ── Auth Service (Port 8008) ────────────────────────────────────────────────
[program:auth]
command=python -m uvicorn app.main:app --host 0.0.0.0 --port 8008
directory=/app/shared/authenticaion
autostart=true
autorestart=true
startretries=5
startsecs=3
stdout_logfile=/var/log/supervisor/auth.log
stderr_logfile=/var/log/supervisor/auth.err.log
priority=10

